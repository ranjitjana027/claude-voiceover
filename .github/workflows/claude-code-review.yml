name: Claude Code Review

# Runs only when the "claude-review" label is added to a PR (needs triage or write access).
# To review again after new pushes, remove the label and add it back.
on:
  pull_request:
    types: [labeled]

jobs:
  review:
    # Secrets aren't available to PRs from forks, so only review same-repo branches.
    if: >-
      github.event.label.name == 'claude-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against CLAUDE.md. Focus on:
            - correctness bugs and regressions in the hooks, text cleaning and command handling
            - safety: process signalling, file writes outside ~/.claude/voiceover/, lock handling, anything that
              could slow or break a Claude Code prompt
            - missing tests, Python 3.9 compatibility, unpinned dependencies
            - docs (README.md, INSTALL.md, CHANGELOG.md) and manifest versions kept in sync

            Use inline comments for specific issues and one short summary comment. Skip praise and style nits.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
